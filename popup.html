<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h2 data-i18n="extName">Just Tab Reloader</h2>
        
        <div class="setting-group status-card">
            <div class="label" data-i18n="statusLabel">自動重讀狀態</div>
            <label class="switch">
                <input type="checkbox" id="toggle-switch">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-group">
            <div class="label" data-i18n="intervalLabel">隨機區間 (秒)</div>
            <div class="inputs">
                <input type="number" id="min-sec" min="1" max="86400" placeholder="Min">
                <span>-</span>
                <input type="number" id="max-sec" min="1" max="86400" placeholder="Max">
            </div>
            <button id="save-btn" data-i18n="saveBtn">儲存設定</button>
            <div id="save-msg" class="msg-hidden" data-i18n="saveMsg">已儲存！</div>
        </div>

        <div class="setting-group status-card">
            <div class="label" data-i18n="autoReopenLabel">啟動時自動重開分頁</div>
            <label class="switch">
                <input type="checkbox" id="auto-reopen-switch">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
